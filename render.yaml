# Despliegue en Render (https://render.com): New → Blueprint → elegir este repositorio.
services:
  - type: web
    name: spacio-dashboard
    runtime: node
    plan: starter # el disco persistente requiere un plan de pago
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TZ
        value: America/Caracas
      - key: ADMIN_PASSWORD
        sync: false # Render la pide al crear el servicio
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
